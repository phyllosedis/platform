# Boot-автоконфигурация Liquibase отключена осознанно:
# миграциями владеет каждый доменный модуль через свой SpringLiquibase-бин
# (db/<module>/changelog.xml на свою БД). При распиле на микросервисы
# каждый сервис уезжает со своим db/<module>/ без изменений.
spring.liquibase.enabled=false

# banking
app.datasource.banking.jdbc-url=${BANKING_DB_URL:jdbc:postgresql://localhost:5432/platform_banking}
app.datasource.banking.username=${BANKING_DB_USERNAME:postgres}
app.datasource.banking.password=${BANKING_DB_PASSWORD:root}
app.datasource.banking.driver-class-name=org.postgresql.Driver
app.jpa.banking.hibernate.hbm2ddl.auto=none
app.jpa.banking.hibernate.show_sql=true
app.jpa.banking.hibernate.format_sql=true
app.jpa.banking.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# messenger (DbConfig пока нет — свойства задел под распил на микросервисы)
app.datasource.messenger.jdbc-url=${MESSENGER_DB_URL:jdbc:postgresql://localhost:5432/platform_messenger}
app.datasource.messenger.username=${MESSENGER_DB_USERNAME:postgres}
