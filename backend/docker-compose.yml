services:
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    env_file:
      - ./env/platform-postgres-template.env
      - ./env/platform-postgres.env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: platform-backend
    ports:
      - "8080:8080"
      - "5005:5005"
    env_file:
      - ./env/platform-postgres-template.env
      - ./env/platform-postgres.env
      - ./env/platform-messenger-template.env
      - ./env/platform-messenger.env
      - ./env/platform-social-template.env
      - ./env/platform-social.env
      - ./env/platform-banking-template.env
      - ./env/platform-banking.env
      - ./env/platform-auth-template.env
      - ./env/platform-auth.env
    networks:
      - app-network
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: platform-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: platform-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - prometheus
volumes:
  pg_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge